syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.isums.scheduleservice.grpc";
option java_outer_classname = "ScheduleProto";

service ScheduleService {
  rpc AutoAssign (AutoAssignRequest) returns (AutoAssignResponse);
}

message AutoAssignRequest {
  string referenceId = 1;
  string tenantId = 2;
  string houseId = 3;
  string referenceType = 4;
}

message AutoAssignResponse {
  string slotId = 1;
  string staffId = 2;
  string status = 3;
}
